name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [test/thai-build, golden/thai-9e27, feat/thai-polish, ci/thai-test, thai/release]

permissions:
  contents: read

jobs:
  build-runtime:
    name: Build Runtime (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UPDATE_DEB_LOCK: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gpgv xz-utils curl python3 tar
      
      - name: Build runtime (arm64-v8a)
        working-directory: runtime
        run: ./build-runtime.sh arm64-v8a
      
      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runtime-out
          path: runtime/out/
          retention-days: 1

  build-apk:
    name: Build APK (arm64)
    needs: build-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: 3.47.7
      GRADLE_VERSION: 9.3.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download runtime artifacts
        uses: actions/download-artifact@v7
        with:
          name: runtime-out
          path: runtime/out

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android NDK 28.2.13676358
        run: |
          echo "Installing Android NDK 28.2.13676358..."
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            echo "Available files in $ANDROID_HOME:"
            find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "NDK installed successfully"
          # Set NDK environment variables for tawcroot build
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Setting up permanent keystore..."
          mkdir -p app/android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/android/app/keystore/release.keystore
          cat > app/android/key.properties <<'EOF'
          storeFile=keystore/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "Keystore configured for permanent signing"
          # Print certificate fingerprint for verification
          keytool -printcert -jarfile app/android/app/keystore/release.keystore 2>/dev/null | grep -A1 "SHA256:" | tail -1 | xargs || true

      - name: Check signing mode
        run: |
          if [ -f app/android/key.properties ]; then
            echo "SIGNING_MODE=permanent" >> $GITHUB_ENV
            echo "This build will be signed with permanent keystore"
            # Print certificate SHA-256 fingerprint
            keytool -printcert -jarfile app/android/app/keystore/release.keystore 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | xargs -I{} echo "CERT_SHA256={}" || true
          else
            echo "SIGNING_MODE=debug" >> $GITHUB_ENV
            echo "This build will be signed with debug keystore (no permanent keystore configured)"
          fi

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Generate localization
        working-directory: app
        run: python3 tool/l10n_merge.py --locale th

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Build APK (arm64)
        working-directory: app
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          bash ../tooling/build-apk.sh -f arm64 --release

      - name: Upload APK (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: dsh-go-thai-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          retention-days: 7

      - name: Verify APK signature
        if: env.SIGNING_MODE == 'permanent'
        run: |
          echo "Verifying APK signature..."
          keytool -printcert -jarfile app/build/app/outputs/flutter-apk/app-arm64-release.apk | grep -E "Owner:|SHA256:" || true
          echo "APK signed with: ${{ env.SIGNING_MODE }} key"