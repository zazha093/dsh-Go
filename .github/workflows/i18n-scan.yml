name: i18n AST Scan (fork-only)

on:
  push:
    branches: [test/thai-build]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  scan:
    name: Scan String Literals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python scanner for all file types
        run: |
          cd i18n-tools
          python3 ast_scan/scan_others.py ../app ../literals.json

      - name: Upload literals artifact
        uses: actions/upload-artifact@v4
        with:
          name: literals
          path: literals.json
          retention-days: 7

      - name: Summary
        run: |
          echo "## i18n String Literal Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 << 'PYEOF'
          import json
          with open('literals.json') as f:
              data = json.load(f)
          print(f'- Total literals: {data["totalLiterals"]}')
          for file, items in data['byFile'].items():
              print(f'- {file}: {len(items)} literals')
          PYEOF

  validate-literals:
    name: Validate Literals
    runs-on: ubuntu-latest
    needs: scan
    timeout-minutes: 10
    steps:
      - name: Download literals artifact
        uses: actions/download-artifact@v4
        with:
          name: literals
          path: .

      - name: Validate JSON structure
        run: |
          python3 << 'PYEOF'
          import json
          with open('literals.json') as f:
              data = json.load(f)
          assert 'totalLiterals' in data
          assert 'byFile' in data
          assert isinstance(data['totalLiterals'], int)
          assert isinstance(data['byFile'], dict)
          print('JSON structure valid')
          print(f'Total literals: {data["totalLiterals"]}')
          print(f'Files scanned: {len(data["byFile"])}')
          PYEOF