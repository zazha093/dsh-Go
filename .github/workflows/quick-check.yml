name: Quick Check

on:
  push:
    branches: [feat/**]
  pull_request:
    branches: [feat/**]
  workflow_dispatch: {}

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Get dependencies
        run: flutter pub get
        working-directory: app

      - name: Verify l10n (check parts only)
        run: python3 tool/l10n_merge.py --check --locale th
        working-directory: app

      - name: Generate l10n (all locales)
        run: python3 tool/l10n_merge.py --locale th
        working-directory: app

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: app

      - name: Test
        run: flutter test --coverage
        working-directory: app

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7