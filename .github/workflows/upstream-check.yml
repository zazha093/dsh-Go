name: Fork Upstream Check

on:
  schedule:
    # Every Wednesday 08:00 UTC (15:00 Thailand) - offset from Monday check
    - cron: '0 8 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check upstream/main ahead of fork/thai-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fork thai/release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zazha093/dsh-Go
          ref: thai/release
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Add upstream remote
        run: git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git

      - name: Fetch upstream/main
        run: git fetch upstream main

      - name: Count commits upstream/main ahead of thai/release
        id: count
        run: |
          AHEAD=$(git rev-list --count thai/release..upstream/main 2>/dev/null || echo "0")
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "Upstream/main is ahead of thai/release by $AHEAD commits"

      - name: Install gh CLI
        if: steps.count.outputs.ahead > 0
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gh

      - name: Check for existing open issue
        if: steps.count.outputs.ahead > 0
        id: existing
        run: |
          ISSUE=$(gh issue list --repo zazha093/dsh-Go --state open --label "sync:upstream" --json number --jq '.[0].number' 2>/dev/null || echo "")
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT

      - name: Create sync issue for thai/release
        if: steps.count.outputs.ahead > 0 && steps.existing.outputs.issue == ''
        env:
          AHEAD_COUNT: ${{ steps.count.outputs.ahead }}
        run: |
          echo '## Upstream Sync Required for thai/release' > /tmp/issue_body.md
          echo '' >> /tmp/issue_body.md
          echo "Upstream/main is ahead of fork/thai-release by ${AHEAD_COUNT} commits." >> /tmp/issue_body.md
          echo '' >> /tmp/issue_body.md
          echo '### Recommended Action' >> /tmp/issue_body.md
          echo '1. Create a sync branch from latest upstream/main:' >> /tmp/issue_body.md
          echo '   git fetch upstream main' >> /tmp/issue_body.md
          echo '   git checkout -b sync-$(date +%Y%m%d) upstream/main' >> /tmp/issue_body.md
          echo '' >> /tmp/issue_body.md
          echo '2. Apply fork customizations to thai/release:' >> /tmp/issue_body.md
          echo '   - Thai ARB files (keep from thai/release)' >> /tmp/issue_body.md
          echo '   - applicationId with .thai suffix in build.gradle.kts' >> /tmp/issue_body.md
          echo '   - AndroidManifest.xml label: DSH Go (Thai)' >> /tmp/issue_body.md
          echo '   - .github/workflows/build-apk.yml (fork version)' >> /tmp/issue_body.md
          echo '   - .github/workflows/upstream-check.yml (this workflow)' >> /tmp/issue_body.md
          echo '   - fork-tools/ directory' >> /tmp/issue_body.md
          echo '' >> /tmp/issue_body.md
          echo '3. Revert ci.yml to upstream version (already done)' >> /tmp/issue_body.md
          echo '' >> /tmp/issue_body.md
          echo '4. Run validation on thai/release:' >> /tmp/issue_body.md
          echo '   python3 app/tool/l10n_merge.py --locale th --no-gen' >> /tmp/issue_body.md
          echo '   python3 app/tool/l10n_merge.py --locale th --check' >> /tmp/issue_body.md
          echo '   tooling/build-apk.sh --build-name <version>' >> /tmp/issue_body.md
          echo '' >> /tmp/issue_body.md
          echo '5. Merge to thai/release after verification.' >> /tmp/issue_body.md
          echo '' >> /tmp/issue_body.md
          echo '### Reference' >> /tmp/issue_body.md
          echo '- Fork: zazha093/dsh-Go' >> /tmp/issue_body.md
          echo '- Upstream: ccch1mneyyy/dsh-Go' >> /tmp/issue_body.md
          echo '- Guide: THAI_FORK_GUIDE.md' >> /tmp/issue_body.md
          gh issue create \
            --repo zazha093/dsh-Go \
            --title "Sync needed: upstream/main ahead of thai/release by ${AHEAD_COUNT} commits" \
            --body-file /tmp/issue_body.md \
            --label "sync:upstream"

      - name: Log no action needed
        if: steps.count.outputs.ahead == '0'
        run: echo "thai/release is up to date with upstream/main"